# VPN: vpn (API and web UI) plus vpn-server, which runs OpenVPN, on the same host.
# Each vpn-server listens on one protocol and port; run one per port you need.
#
#   export VPN_PUBLIC_HOST=vpn.example.com   # the name or IP clients connect to
#   openssl rand -hex 32 > openasy-kek       # encrypts the CA key and sign-in secrets (ADR 0021)
#   docker compose up -d vpn
#   docker compose logs vpn | grep 'no owner yet'   # the one-time link that creates the owner account
#
# Then add the servers under Servers, edge-1 and edge-1-tcp, and start each with its one-time token (ADR 0032):
#
#   EDGE_1_TOKEN=ove_... EDGE_1_TCP_TOKEN=ove_... docker compose up -d
#
# Servers at other locations run vpn-server on their own host: add each under Servers with its address, and run
# the command shown there. Client configs list every server, so clients move to the next one when one is down.
#
# Keep openasy-kek apart from the volume, and with your backups: without it the CA cannot be opened.
services:
  vpn:
    image: ghcr.io/openasy/vpn:0.11.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # UI and API; put a TLS proxy in front to reach it from elsewhere
    volumes:
      - vpn-data:/data # SQLite database, CA and settings
    secrets:
      - openasy-kek # mounted at /run/secrets/openasy-kek
    environment:
      # The address people open vpn at; with a TLS proxy in front, its https:// URL.
      VPN_PUBLIC_URL: ${VPN_PUBLIC_URL:-http://localhost:8080}
      # The address of servers added without one of their own.
      VPN_PUBLIC_HOST: ${VPN_PUBLIC_HOST:?set VPN_PUBLIC_HOST}
      # Deprecated: the token servers set up before 0.6.0 share. Enrol them under Servers, then remove it.
      VPN_SERVER_TOKEN: ${VPN_SERVER_TOKEN:-}
      VPN_NETWORK: 10.8.0.0/24

  vpn-server:
    image: ghcr.io/openasy/vpn-server:0.11.0
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      net.ipv4.ip_forward: 1 # lets clients reach the networks behind this host
    ports:
      - "1194:1194/udp"
    volumes:
      - vpn-server-data:/var/lib/openasy-vpn # its secret: without it, the server must be enrolled again
    environment:
      VPN_URL: http://vpn:8080
      VPN_ENROLL_TOKEN: ${EDGE_1_TOKEN:-}
      # Until it is enrolled, a server set up before 0.6.0 keeps working with these.
      VPN_SERVER_TOKEN: ${VPN_SERVER_TOKEN:-}
      VPN_SERVER_ID: edge-1
      OPENVPN_PROTO: udp
      OPENVPN_PORT: "1194"
    depends_on:
      - vpn

  # The same server on TCP 443, for networks that block everything except HTTPS.
  # Client configs list it after UDP, so clients fall back to it. Remove it if you do not need it.
  vpn-server-tcp:
    image: ghcr.io/openasy/vpn-server:0.11.0
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      net.ipv4.ip_forward: 1
    ports:
      - "443:443/tcp"
    volumes:
      - vpn-server-tcp-data:/var/lib/openasy-vpn
    environment:
      VPN_URL: http://vpn:8080
      VPN_ENROLL_TOKEN: ${EDGE_1_TCP_TOKEN:-}
      VPN_SERVER_TOKEN: ${VPN_SERVER_TOKEN:-}
      VPN_SERVER_ID: edge-1-tcp
      OPENVPN_PROTO: tcp
      OPENVPN_PORT: "443"
    depends_on:
      - vpn

volumes:
  vpn-data:
  vpn-server-data:
  vpn-server-tcp-data:

secrets:
  openasy-kek:
    file: ./openasy-kek
